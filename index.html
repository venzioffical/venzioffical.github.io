<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Venzi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; /* Prevents text selection on long press */
            -webkit-user-select: none;
        }

        body {
            background-color: #f8f9fa;
            color: #1a1a1a;
            padding-bottom: 80px;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #fff;
            border-bottom: 1px solid #eaeaea;
        }
        .top-header h2 { font-size: 22px; font-weight: 700; }
        .header-icons { display: flex; gap: 12px; }
        .icon-btn {
            background: #f0f0f2;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .main-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        .page-title h1 { font-size: 26px; font-weight: 800; }
        .page-title p { color: #666; font-size: 14px; margin-top: 4px; margin-bottom: 20px; }

        /* Story Section */
        .story-section { display: flex; gap: 15px; margin-bottom: 20px; }
        .story-item { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #666; }
        .story-circle {
            width: 60px; height: 60px; border-radius: 50%;
            border: 2px dashed #007aff; display: flex; align-items: center;
            justify-content: center; font-size: 24px; color: #007aff;
            margin-bottom: 6px; cursor: pointer;
        }

        /* Post Card Styling */
        .post-card {
            position: relative;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
        }
        .post-card.pinned {
            border: 2px solid #007aff;
            background: #f0f7ff;
        }
        .pin-badge {
            display: none;
            font-size: 12px;
            color: #007aff;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .post-card.pinned .pin-badge { display: block; }

        .post-header { font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .post-content { font-size: 14px; color: #333; line-height: 1.4; }
        .active-reaction { margin-top: 8px; font-size: 18px; }

        /* Long Press Floating Menu Overlay */
        .action-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .action-overlay.active { display: flex; }

        .action-popup {
            background: #fff;
            width: 280px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popupAnim 0.2s ease-out;
        }
        @keyframes popupAnim {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Reaction Bar inside Menu */
        .popup-reactions {
            display: flex;
            justify-content: space-around;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            margin-bottom: 8px;
        }
        .emoji-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .emoji-btn:active { transform: scale(1.3); }

        /* Option Menu Actions (Pin / Delete) */
        .menu-options { display: flex; flex-direction: column; gap: 4px; }
        .menu-btn {
            background: none;
            border: none;
            padding: 12px;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn:hover { background: #f5f5f5; }
        .menu-btn.delete { color: #ff3b30; }

        /* Login / Signup Auth Section */
        .auth-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-top: 24px;
        }
        .auth-card img.logo { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; }
        .input {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px;
        }
        .primary-btn, .secondary-btn {
            width: 100%; padding: 12px; margin: 6px 0;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        .primary-btn { background: #000; color: #fff; }
        .secondary-btn { background: #f0f0f0; color: #333; }

        /* Bottom Fixed Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-decoration: none;
            color: #8e8e93; font-size: 11px; font-weight: 500; flex: 1;
        }
        .nav-item.active { color: #000000; font-weight: 600; }
        .nav-item.active .nav-icon { stroke: #000000; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-header">
        <h2>Venzi</h2>
        <div class="header-icons">
            <button class="icon-btn">🌙</button>
            <button class="icon-btn">👤</button>
        </div>
    </div>

    <div class="main-container">
        <div class="page-title">
            <h1>Home</h1>
            <p>Hold/Tap any post for Options (React, Pin, Delete)</p>
        </div>

        <div class="story-section">
            <div class="story-item">
                <div class="story-circle">+</div>
                <span>Your Story</span>
            </div>
        </div>

        <!-- Sample Posts (Hold to trigger Menu) -->
        <div class="post-card" id="post1" onmousedown="startHold(this)" onmouseup="endHold()" onmouseleave="endHold()" ontouchstart="startHold(this)" ontouchend="endHold()">
            <div class="pin-badge">📌 Pinned Message</div>
            <div class="post-header">Krishna</div>
            <div class="post-content">Press and HOLD on this box to see React, Pin, or Delete options!</div>
            <div class="active-reaction" id="react1"></div>
        </div>

        <div class="post-card" id="post2" onmousedown="startHold(this)" onmouseup="endHold()" onmouseleave="endHold()" ontouchstart="startHold(this)" ontouchend="endHold()">
            <div class="pin-badge">📌 Pinned Message</div>
            <div class="post-header">Venzi Group</div>
            <div class="post-content">Welcome to the new group features! Try long-pressing me too.</div>
            <div class="active-reaction" id="react2"></div>
        </div>

        <!-- Auth Section -->
        <div id="authPage" class="auth-card">
            <img src="1787225529289.png" class="logo" alt="Venzi Logo" onerror="this.style.display='none'">
            <h2>Venzi Account</h2>
            <input id="emailInput" class="input" type="email" placeholder="Email">
            <input id="passwordInput" class="input" type="password" placeholder="Password">
            <button class="primary-btn">Log In</button>
            <button class="secondary-btn">Create Account</button>
        </div>
    </div>

    <!-- Hold-Tap Action Popup Modal -->
    <div class="action-overlay" id="actionOverlay" onclick="closeOverlay(event)">
        <div class="action-popup">
            <div class="popup-reactions">
                <button class="emoji-btn" onclick="addReaction('👍')">👍</button>
                <button class="emoji-btn" onclick="addReaction('❤️')">❤️</button>
                <button class="emoji-btn" onclick="addReaction('😂')">😂</button>
                <button class="emoji-btn" onclick="addReaction('🔥')">🔥</button>
                <button class="emoji-btn" onclick="addReaction('🎉')">🎉</button>
            </div>
            <div class="menu-options">
                <button class="menu-btn" onclick="togglePin()">📌 Pin / Unpin Post</button>
                <button class="menu-btn delete" onclick="deletePost()">🗑️ Delete Post</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="#home" class="nav-item active">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="#explore" class="nav-item">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Explore</span>
      </a>
      <a href="#groups" class="nav-item">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Groups</span>
      </a>
      <a href="#vault" class="nav-item">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.93 2.5H4a2 2 0 0 0-2 2v13.5a2 2 0 0 0 2 2z"/></svg>
        <span>Vault</span>
      </a>
    </nav>

    <!-- JavaScript Logic for Long-Press and Popup Actions -->
    <script>
        let holdTimer;
        let selectedPost = null;

        function startHold(element) {
            selectedPost = element;
            holdTimer = setTimeout(() => {
                document.getElementById('actionOverlay').classList.add('active');
            }, 500); // 500ms long press delay
        }

        function endHold() {
            clearTimeout(holdTimer);
        }

        function closeOverlay(event) {
            if (event.target.id === 'actionOverlay') {
                document.getElementById('actionOverlay').classList.remove('active');
            }
        }

        function addReaction(emoji) {
            if (selectedPost) {
                let reactDiv = selectedPost.querySelector('.active-reaction');
                reactDiv.innerText = emoji;
            }
            document.getElementById('actionOverlay').classList.remove('active');
        }

        function togglePin() {
            if (selectedPost) {
                selectedPost.classList.toggle('pinned');
            }
            document.getElementById('actionOverlay').classList.remove('active');
        }

        function deletePost() {
            if (selectedPost) {
                selectedPost.style.display = 'none';
            }
            document.getElementById('actionOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
