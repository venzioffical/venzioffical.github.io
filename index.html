<!DOCTYPE html>
<html>
<head>
  <title>Venzi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #111;
    }

    .topbar {
      height: 60px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logoText {
      font-size: 24px;
      font-weight: bold;
    }

    .topIcon {
      font-size: 25px;
    }

    .page {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding-bottom: 80px;
    }

    .box {
      background: #fff;
      padding: 22px;
      margin: 20px 12px;
      border-radius: 16px;
      border: 1px solid #e5e5e5;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .center {
      text-align: center;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .blackBtn {
      background: #111;
      color: white;
    }

    .grayBtn {
      background: #666;
      color: white;
    }

    .lightBtn {
      background: #e5e5e5;
      color: #111;
    }

    .deleteBtn {
      background: #d90429;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .status {
      text-align: center;
      min-height: 20px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .groupCard {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .groupCard h3 {
      margin: 8px 0 5px;
      font-size: 19px;
    }

    .groupCard p {
      color: #666;
      margin: 5px 0;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 5px;
    }

    .public {
      background: #e5f8eb;
      color: #087f23;
    }

    .private {
      background: #ffe5e8;
      color: #c1121f;
    }

    .owner {
      background: #eee;
      color: #333;
    }

    .bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .navItem {
      text-align: center;
      font-size: 12px;
      color: #333;
      cursor: pointer;
    }

    .navIcon {
      display: block;
      font-size: 23px;
      margin-bottom: 2px;
    }

    .members {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 20px;
    }

    .member {
      background: #eee;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    /* CHAT */

    .chatPage {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    .chatHeader {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      background: #fff;
    }

    .backChat {
      font-size: 25px;
      cursor: pointer;
    }

    .chatTitle {
      font-weight: bold;
      font-size: 18px;
    }

    .chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    .message.mine {
      align-items: flex-end;
    }

    .message.other {
      align-items: flex-start;
    }

    .sender {
      font-size: 10px;
      color: #888;
      margin-bottom: 3px;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 18px;
      background: #e5e5e5;
      word-wrap: break-word;
    }

    .mine .bubble {
      background: #111;
      color: white;
    }

    .chatInputArea {
      padding: 10px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
      background: white;
    }

    .chatInputArea input {
      margin: 0;
      flex: 1;
      border-radius: 22px;
    }

    .sendBtn {
      width: auto;
      padding: 12px 18px;
      border-radius: 22px;
      margin: 0;
      background: #111;
      color: white;
    }

    .requestRow {
      border-top: 1px solid #eee;
      padding: 10px 0;
    }

    .requestButtons {
      display: flex;
      gap: 6px;
      margin-top: 7px;
    }

    .requestButtons button {
      margin: 0;
      padding: 8px;
    }

    .accept {
      background: #0a7d2c;
      color: white;
    }

    .reject {
      background: #d90429;
      color: white;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="logoText">Venzi</div>
  <div class="topIcon">💬</div>
</div>

<div class="page">

  <!-- LOGIN -->
  <div class="box center" id="authBox">
    <h2>Welcome to Venzi</h2>
    <p>Login or create your account</p>

    <div class="status" id="authStatus"></div>

    <input type="email" id="emailInput" placeholder="Email">
    <input type="password" id="passwordInput" placeholder="Password">

    <button class="blackBtn" onclick="signUp()">Create Account</button>
    <button class="grayBtn" onclick="logIn()">Login</button>
  </div>


  <!-- HOME -->
  <div class="box center hidden" id="homeBox">
    <h2 id="welcomeText">Welcome</h2>
    <p>What would you like to do?</p>

    <button class="blackBtn" onclick="showCreateGroup()">
      ➕ Create Group
    </button>

    <button class="grayBtn" onclick="showJoinGroup()">
      🔍 Browse / Join Groups
    </button>

    <button class="lightBtn" onclick="showMyGroups()">
      👥 My Groups
    </button>

    <button class="lightBtn" onclick="logOut()">
      Logout
    </button>
  </div>


  <!-- CREATE GROUP -->
  <div class="box hidden" id="createGroupBox">
    <h2>Create Group</h2>

    <div class="status" id="createStatus"></div>

    <input
      type="text"
      id="groupName"
      placeholder="Group name"
    >

    <textarea
      id="groupDescription"
      placeholder="Group description"
    ></textarea>

    <p><b>Visibility</b></p>

    <label>
      <input
        type="radio"
        name="visibility"
        value="public"
        checked
      >
      🌍 Public
    </label>

    <br><br>

    <label>
      <input
        type="radio"
        name="visibility"
        value="private"
      >
      🔒 Private
    </label>

    <br><br>

    <input
      type="text"
      id="invites"
      placeholder="Invite emails (optional)"
    >

    <button class="blackBtn" onclick="createGroup()">
      Create Group
    </button>

    <button class="lightBtn" onclick="goHome()">
      Back
    </button>
  </div>


  <!-- BROWSE GROUPS -->
  <div class="box hidden" id="browseBox">
    <h2>Browse Groups</h2>

    <div class="status" id="browseStatus"></div>

    <input
      type="text"
      id="searchInput"
      placeholder="Search groups..."
      oninput="renderGroups()"
    >

    <div id="groupsContainer"></div>

    <button class="lightBtn" onclick="goHome()">
      Back
    </button>
  </div>


  <!-- MY GROUPS -->
  <div class="box hidden" id="myGroupsBox">
    <h2>My Groups</h2>

    <div class="status" id="myGroupsStatus"></div>

    <div id="myGroupsContainer"></div>

    <button class="lightBtn" onclick="goHome()">
      Back
    </button>
  </div>


  <!-- GROUP INFO -->
  <div class="box hidden" id="groupInfoBox">

    <span id="groupTag" class="tag"></span>

    <h2 id="groupTitle"></h2>

    <p id="groupDescriptionText"></p>

    <h3>👥 Members</h3>

    <div class="members" id="membersContainer"></div>

    <button class="blackBtn" onclick="openChat()">
      💬 Open Chat
    </button>

    <button class="lightBtn" onclick="showMyGroups()">
      Back
    </button>

  </div>

</div>


<!-- BOTTOM NAV -->
<div class="bottomNav hidden" id="bottomNav">

  <div class="navItem" onclick="goHome()">
    <span class="navIcon">⌂</span>
    Home
  </div>

  <div class="navItem" onclick="showJoinGroup()">
    <span class="navIcon">🔍</span>
    Groups
  </div>

  <div class="navItem" onclick="showCreateGroup()">
    <span class="navIcon">＋</span>
    Create
  </div>

  <div class="navItem" onclick="showMyGroups()">
    <span class="navIcon">☺</span>
    My Groups
  </div>

</div>


<!-- FULL SCREEN CHAT -->
<div class="chatPage hidden" id="chatPage">

  <div class="chatHeader">

    <div class="backChat" onclick="closeChat()">
      ←
    </div>

    <div class="chatTitle" id="chatTitle">
      Group Chat
    </div>

  </div>

  <div class="chatMessages" id="chatMessages"></div>

  <div class="chatInputArea">

    <input
      type="text"
      id="chatInput"
      placeholder="Message..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button
      class="sendBtn"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  getDoc,
  doc,
  updateDoc,
  deleteDoc,
  arrayUnion,
  arrayRemove,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyDQmh4yBGXeOiAIn-pKANxl3BR2H-jQPHE",

  authDomain:
    "venzi-community.firebaseapp.com",

  projectId:
    "venzi-community",

  storageBucket:
    "venzi-community.firebasestorage.app",

  messagingSenderId:
    "1008790056674",

  appId:
    "1:1008790056674:web:22fa088270df6a5be938bb"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let currentUser = null;

let currentGroupId = null;

let currentGroupData = null;

let chatUnsubscribe = null;

let allGroups = [];


/* PAGE CONTROL */

function hideAllBoxes() {

  const boxes = [
    "authBox",
    "homeBox",
    "createGroupBox",
    "browseBox",
    "myGroupsBox",
    "groupInfoBox"
  ];

  boxes.forEach(id => {

    document
      .getElementById(id)
      .classList
      .add("hidden");

  });

}


function showBox(id) {

  hideAllBoxes();

  document
    .getElementById(id)
    .classList
    .remove("hidden");

}


/* AUTH */

window.signUp = async function() {

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim();

  const password =
    document
      .getElementById("passwordInput")
      .value;

  const status =
    document.getElementById("authStatus");

  if (!email || !password) {

    status.innerText =
      "Email and password required.";

    return;
  }

  try {

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    status.innerText =
      "Account created!";

  } catch(error) {

    status.innerText =
      error.message;

  }

};


window.logIn = async function() {

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim();

  const password =
    document
      .getElementById("passwordInput")
      .value;

  const status =
    document.getElementById("authStatus");

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  } catch(error) {

    status.innerText =
      error.message;

  }

};


window.logOut = function() {

  signOut(auth);

};


onAuthStateChanged(auth, user => {

  currentUser = user;

  if (user) {

    showBox("homeBox");

    document
      .getElementById("welcomeText")
      .innerText =
      "Welcome, " + user.email;

    document
      .getElementById("bottomNav")
      .classList
      .remove("hidden");

  } else {

    showBox("authBox");

    document
      .getElementById("bottomNav")
      .classList
      .add("hidden");

  }

});


/* HOME */

window.goHome = function() {

  showBox("homeBox");

};


/* CREATE GROUP */

window.showCreateGroup = function() {

  showBox("createGroupBox");

};


window.createGroup = async function() {

  const name =
    document
      .getElementById("groupName")
      .value
      .trim();

  const description =
    document
      .getElementById("groupDescription")
      .value
      .trim();

  const visibility =
    document
      .querySelector(
        'input[name="visibility"]:checked'
      )
      .value;

  const invitesRaw =
    document
      .getElementById("invites")
      .value
      .trim();

  const status =
    document.getElementById("createStatus");


  if (!name) {

    status.innerText =
      "Please enter group name.";

    return;

  }


  const invitedEmails =
    invitesRaw
      ? invitesRaw
          .split(",")
          .map(x => x.trim().toLowerCase())
          .filter(Boolean)
      : [];


  try {

    await addDoc(
      collection(db, "groups"),
      {

        name: name,

        description: description,

        isPublic:
          visibility === "public",

        ownerId:
          currentUser.uid,

        ownerEmail:
          currentUser.email,

        members: [
          currentUser.uid
        ],

        memberEmails: [
          currentUser.email
        ],

        invitedEmails:
          invitedEmails,

        pendingJoinRequests: [],

        createdAt:
          serverTimestamp()

      }
    );


    status.style.color =
      "#087f23";

    status.innerText =
      "Group created successfully!";


    setTimeout(() => {

      goHome();

    }, 1000);


  } catch(error) {

    status.style.color =
      "#d90429";

    status.innerText =
      error.message;

  }

};


/* BROWSE GROUPS */

window.showJoinGroup = async function() {

  showBox("browseBox");

  const status =
    document.getElementById("browseStatus");

  status.innerText =
    "Loading groups...";


  try {

    const snapshot =
      await getDocs(
        collection(db, "groups")
      );

    allGroups = [];

    snapshot.forEach(d => {

      allGroups.push({
        id: d.id,
        ...d.data()
      });

    });


    status.innerText = "";

    renderGroups();


  } catch(error) {

    status.innerText =
      error.message;

  }

};


window.renderGroups = function() {

  const container =
    document.getElementById(
      "groupsContainer"
    );

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  container.innerHTML = "";


  const filtered =
    allGroups.filter(g =>
      (g.name || "")
        .toLowerCase()
        .includes(search)
    );


  if (!filtered.length) {

    container.innerHTML =
      "<p>No groups found.</p>";

    return;

  }


  filtered.forEach(g => {

    const isMember =
      (g.members || [])
        .includes(currentUser.uid);


    const hasRequest =
      (g.pendingJoinRequests || [])
        .some(r =>
          r.uid === currentUser.uid
        );


    const card =
      document.createElement("div");

    card.className =
      "groupCard";


    const tagClass =
      g.isPublic
        ? "public"
        : "private";


    let button = "";


    if (isMember) {

      button = `
        <button
          class="blackBtn"
          onclick="openGroup('${g.id}')"
        >
          Open Group
        </button>
      `;

    } else if (!g.isPublic && hasRequest) {

      button = `
        <button
          class="lightBtn"
          disabled
        >
          Request Pending
        </button>
      `;

    } else if (g.isPublic) {

      button = `
        <button
          class="blackBtn"
          onclick="joinGroup('${g.id}')"
        >
          Join
        </button>
      `;

    } else {

      button = `
        <button
          class="blackBtn"
          onclick="requestJoin('${g.id}')"
        >
          Request to Join
        </button>
      `;

    }


    card.innerHTML = `

      <span class="tag ${tagClass}">
        ${g.isPublic ? "🌍 PUBLIC" : "🔒 PRIVATE"}
      </span>

      <h3>${escapeHTML(g.name)}</h3>

      <p>
        ${escapeHTML(
          g.description || "No description"
        )}
      </p>

      <p>
        ${(g.members || []).length}
        members
      </p>

      ${button}

    `;


    container.appendChild(card);

  });

};


/* JOIN PUBLIC */

window.joinGroup = async function(groupId) {

  try {

    await updateDoc(
      doc(db, "groups", groupId),
      {

        members:
          arrayUnion(currentUser.uid),

        memberEmails:
          arrayUnion(currentUser.email)

      }
    );


    showJoinGroup();

  } catch(error) {

    alert(
      "Error joining group: " +
      error.message
    );

  }

};


/* REQUEST PRIVATE */

window.requestJoin = async function(groupId) {

  try {

    await updateDoc(
      doc(db, "groups", groupId),
      {

        pendingJoinRequests:
          arrayUnion({

            uid:
              currentUser.uid,

            email:
              currentUser.email

          })

      }
    );


    showJoinGroup();

  } catch(error) {

    alert(
      "Error: " +
      error.message
    );

  }

};


/* MY GROUPS */

window.showMyGroups = async function() {

  showBox("myGroupsBox");

  const container =
    document.getElementById(
      "myGroupsContainer"
    );

  const status =
    document.getElementById(
      "myGroupsStatus"
    );

  container.innerHTML = "";

  status.innerText =
    "Loading...";


  try {

    const snapshot =
      await getDocs(
        collection(db, "groups")
      );


    const groups = [];


    snapshot.forEach(d => {

      const data = d.data();

      if (
        (data.members || [])
          .includes(currentUser.uid)
      ) {

        groups.push({
          id: d.id,
          ...data
        });

      }

    });


    status.innerText = "";


    if (!groups.length) {

      container.innerHTML =
        "<p>No groups yet.</p>";

      return;

    }


    groups.forEach(g => {

      const card =
        document.createElement("div");

      card.className =
        "groupCard";


      const isOwner =
        g.ownerId === currentUser.uid;


      let requestsHTML = "";


      if (
        isOwner &&
        (g.pendingJoinRequests || []).length
      ) {

        requestsHTML =
          "<h4>Join Requests</h4>";


        g.pendingJoinRequests
          .forEach(r => {

            requestsHTML += `

              <div class="requestRow">

                <div>
                  ${escapeHTML(r.email)}
                </div>

                <div class="requestButtons">

                  <button
                    class="accept"
                    onclick="
                      acceptRequest(
                        '${g.id}',
                        '${r.uid}',
                        '${escapeJS(r.email)}'
                      )
                    "
                  >
                    Accept
                  </button>

                  <button
                    class="reject"
                    onclick="
                      rejectRequest(
                        '${g.id}',
                        '${r.uid}',
                        '${escapeJS(r.email)}'
                      )
                    "
                  >
                    Reject
                  </button>

                </div>

              </div>

            `;

          });

      }


      card.innerHTML = `

        <span class="tag ${
          g.isPublic
            ? "public"
            : "private"
        }">

          ${
            g.isPublic
              ? "🌍 PUBLIC"
              : "🔒 PRIVATE"
          }

        </span>

        ${
          isOwner
            ? `
              <span class="tag owner">
                👑 OWNER
              </span>
            `
            : ""
        }

        <h3>
          ${escapeHTML(g.name)}
        </h3>

        <p>
          ${escapeHTML(
            g.description || "No description"
          )}
        </p>

        <p>
          ${(g.members || []).length}
          members
        </p>

        ${requestsHTML}

        <button
          class="blackBtn"
          onclick="openGroup('${g.id}')"
        >
          Open Group
        </button>

        ${
          isOwner
            ? `
              <button
                class="deleteBtn"
                onclick="
                  deleteGroup(
                    '${g.id}',
                    '${escapeJS(g.name)}'
                  )
                "
              >
                🗑 Delete Group
              </button>
            `
            : ""
        }

      `;


      container.appendChild(card);

    });


  } catch(error) {

    status.innerText =
      error.message;

  }

};


/* ACCEPT REQUEST */

window.acceptRequest =
async function(groupId, uid, email) {

  try {

    const groupRef =
      doc(db, "groups", groupId);


    const snap =
      await getDoc(groupRef);


    if (!snap.exists()) {

      alert("Group does not exist.");

      return;

    }


    if (
      snap.data().ownerId !==
      currentUser.uid
    ) {

      alert(
        "Only the group owner can accept requests."
      );

      return;

    }


    await updateDoc(
      groupRef,
      {

        members:
          arrayUnion(uid),

        memberEmails:
          arrayUnion(email),

        pendingJoinRequests:
          arrayRemove({
            uid: uid,
            email: email
          })

      }
    );


    showMyGroups();


  } catch(error) {

    alert(
      "Error: " +
      error.message
    );

  }

};


/* REJECT REQUEST */

window.rejectRequest =
async function(groupId, uid, email) {

  try {

    const groupRef =
      doc(db, "groups", groupId);


    const snap =
      await getDoc(groupRef);


    if (!snap.exists()) {

      alert("Group does not exist.");

      return;

    }


    if (
      snap.data().ownerId !==
      currentUser.uid
    ) {

      alert(
        "Only the group owner can reject requests."
      );

      return;

    }


    await updateDoc(
      groupRef,
      {

        pendingJoinRequests:
          arrayRemove({
            uid: uid,
            email: email
          })

      }
    );


    showMyGroups();


  } catch(error) {

    alert(
      "Error: " +
      error.message
    );

  }

};


/* OPEN GROUP */

window.openGroup = async function(groupId) {

  try {

    const groupRef =
      doc(db, "groups", groupId);


    const snap =
      await getDoc(groupRef);


    if (!snap.exists()) {

      alert("Group not found.");

      return;

    }


    const data =
      snap.data();


    if (
      !(data.members || [])
        .includes(currentUser.uid)
    ) {

      alert(
        "You are not a member of this group."
      );

      return;

    }


    currentGroupId =
      groupId;

    currentGroupData =
      data;


    showBox("groupInfoBox");


    document
      .getElementById("groupTitle")
      .innerText =
      data.name;


    document
      .getElementById(
        "groupDescriptionText"
      )
      .innerText =
      data.description ||
      "No description";


    const tag =
      document.getElementById(
        "groupTag"
      );


    tag.className =
      "tag " +
      (
        data.isPublic
          ? "public"
          : "private"
      );


    tag.innerText =
      data.isPublic
        ? "🌍 PUBLIC"
        : "🔒 PRIVATE";


    const members =
      document.getElementById(
        "membersContainer"
      );


    members.innerHTML = "";


    (data.memberEmails || [])
      .forEach(email => {

        const span =
          document.createElement(
            "span"
          );

        span.className =
          "member";

        span.innerText =
          email === data.ownerEmail
            ? email + " 👑"
            : email;

        members.appendChild(span);

      });


  } catch(error) {

    alert(
      "Error opening group: " +
      error.message
    );

  }

};


/* CHAT */

window.openChat = function() {

  if (!currentGroupId) return;


  document
    .getElementById("chatTitle")
    .innerText =
    currentGroupData.name;


  document
    .getElementById("chatPage")
    .classList
    .remove("hidden");


  listenToChat(
    currentGroupId
  );

};


function listenToChat(groupId) {

  if (chatUnsubscribe) {

    chatUnsubscribe();

    chatUnsubscribe = null;

  }


  const q =
    query(
      collection(
        db,
        "groups",
        groupId,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );


  chatUnsubscribe =
    onSnapshot(
      q,
      snapshot => {

        const container =
          document.getElementById(
            "chatMessages"
          );


        container.innerHTML = "";


        snapshot.forEach(d => {

          const msg =
            d.data();


          const div =
            document.createElement(
              "div"
            );


          const mine =
            msg.senderId ===
            currentUser.uid;


          div.className =
            "message " +
            (
              mine
                ? "mine"
                : "other"
            );


          div.innerHTML = `

            <div class="sender">
              ${
                mine
                  ? "You"
                  : escapeHTML(
                      msg.senderEmail ||
                      "Unknown"
                    )
              }
            </div>

            <div class="bubble">
              ${escapeHTML(
                msg.text || ""
              )}
            </div>

          `;


          container.appendChild(div);

        });


        container.scrollTop =
          container.scrollHeight;

      }
    );

}


window.sendMessage =
async function() {

  const input =
    document.getElementById(
      "chatInput"
    );


  const text =
    input.value.trim();


  if (
    !text ||
    !currentGroupId
  ) return;


  input.value = "";


  try {

    await addDoc(
      collection(
        db,
        "groups",
        currentGroupId,
        "messages"
      ),
      {

        text: text,

        senderId:
          currentUser.uid,

        senderEmail:
          currentUser.email,

        createdAt:
          serverTimestamp()

      }
    );


  } catch(error) {

    alert(
      "Error sending message: " +
      error.message
    );

  }

};


window.closeChat = function() {

  if (chatUnsubscribe) {

    chatUnsubscribe();

    chatUnsubscribe = null;

  }


  document
    .getElementById("chatPage")
    .classList
    .add("hidden");

};


/* =========================================
   DELETE GROUP
   ========================================= */

window.deleteGroup =
async function(groupId, groupName) {

  const confirmDelete =
    confirm(
      "Delete \"" +
      groupName +
      "\"?\n\n" +
      "This will delete the group and all its chat messages."
    );


  if (!confirmDelete) {

    return;

  }


  try {

    const groupRef =
      doc(
        db,
        "groups",
        groupId
      );


    /* FIRST: CHECK GROUP */

    const groupSnap =
      await getDoc(groupRef);


    if (!groupSnap.exists()) {

      alert(
        "Group already deleted."
      );

      showMyGroups();

      return;

    }


    const groupData =
      groupSnap.data();


    /* ONLY OWNER */

    if (
      groupData.ownerId !==
      currentUser.uid
    ) {

      alert(
        "Only the group owner can delete this group."
      );

      return;

    }


    /* DELETE ALL CHAT MESSAGES */

    const messagesRef =
      collection(
        db,
        "groups",
        groupId,
        "messages"
      );


    const messagesSnap =
      await getDocs(messagesRef);


    const deleteMessages = [];


    messagesSnap.forEach(messageDoc => {

      deleteMessages.push(
        deleteDoc(messageDoc.ref)
      );

    });


    await Promise.all(
      deleteMessages
    );


    /* DELETE GROUP */

    await deleteDoc(
      groupRef
    );


    /* CLOSE CHAT IF OPEN */

    if (
      currentGroupId ===
      groupId
    ) {

      currentGroupId =
        null;

      currentGroupData =
        null;

      if (chatUnsubscribe) {

        chatUnsubscribe();

        chatUnsubscribe = null;

      }

      document
        .getElementById("chatPage")
        .classList
        .add("hidden");

    }


    alert(
      "Group and its chat were deleted successfully."
    );


    showMyGroups();


  } catch(error) {

    console.error(
      "Delete group error:",
      error
    );


    alert(
      "Error deleting group: " +
      error.message
    );

  }

};


/* SECURITY HELPERS */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJS(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}
